<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TVDev Studio — TV Cursor Receiver</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Status overlay (shown when disconnected) ───────────────────── */
    #status-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      z-index: 9000;
      transition: opacity 0.4s ease;
    }

    #status-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .status-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }

    .status-icon.connecting { background: rgba(255,190,0,0.2); animation: pulse 1.5s ease infinite; }
    .status-icon.error      { background: rgba(255,60,60,0.2); }
    .status-icon.connected  { background: rgba(0,230,118,0.2); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,190,0,0.4); }
      50%       { box-shadow: 0 0 0 16px rgba(255,190,0,0); }
    }

    .status-title  { font-size: 22px; font-weight: 600; }
    .status-detail { font-size: 14px; color: rgba(255,255,255,0.5); max-width: 340px; text-align: center; line-height: 1.5; }

    /* ── Virtual cursor ──────────────────────────────────────────────── */
    #virtual-cursor {
      position: fixed;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
      border: 2px solid #000;
      pointer-events: none;
      z-index: 999999;
      transition: transform 0.05s linear;
      opacity: 0;
    }

    #virtual-cursor.visible { opacity: 1; }
    #virtual-cursor.pressed { transform: scale(0.85); }
    #virtual-cursor.pulse { animation: cursor-pulse 150ms ease-out; }

    @keyframes cursor-pulse {
      0% { transform: scale(1); }
      50% { transform: scale(0.6); }
      100% { transform: scale(1); }
    }

    /* SVG arrow cursor inside virtual-cursor */
    #virtual-cursor svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 4px rgba(59, 130, 246, 0.7));
    }

    /* Click ripple */
    #click-ripple {
      position: fixed;
      width: 0; height: 0;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.55);
      border: 2px solid #60a5fa;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    @keyframes ripple-expand {
      0%   { width: 0; height: 0; opacity: 0.9; }
      100% { width: 80px; height: 80px; opacity: 0; }
    }

    #click-ripple.active {
      animation: ripple-expand 0.35s ease-out forwards;
    }
  </style>
</head>
<body>

  <!-- Status overlay — shown when disconnected / connecting -->
  <div id="status-overlay">
    <div class="status-icon connecting" id="status-icon">📡</div>
    <div class="status-title" id="status-title">Connecting…</div>
    <div class="status-detail" id="status-detail">Waiting for TVDev Studio on your Mac.</div>
  </div>

  <!-- Virtual cursor arrow -->
  <div id="virtual-cursor">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 2L19 12L11 13.5L7.5 20.5L3 2Z" fill="#ffffff" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
      <path d="M3 2L19 12L11 13.5L7.5 20.5L3 2Z" fill="url(#gradient)" opacity="0.3"/>
      <defs>
        <linearGradient id="gradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop stop-color="#3b82f6"/>
          <stop offset="1" stop-color="#1d4ed8"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- Click ripple effect -->
  <div id="click-ripple"></div>

  <script>
    // ── Configuration ──────────────────────────────────────────────────
    // Read token + host from URL query params:
    // e.g. http://192.168.1.5:8080/tizen-receiver/index.html?host=192.168.1.5&port=9877&token=abc123
    const params = new URLSearchParams(window.location.search);
    const WS_HOST  = params.get('host')  || window.location.hostname;
    const WS_PORT  = params.get('port')  || '9877';
    const WS_TOKEN = params.get('token') || '';
    const RECONNECT_DELAY_MS = 3000;

    // ── DOM refs ───────────────────────────────────────────────────────
    const overlay     = document.getElementById('status-overlay');
    const statusIcon  = document.getElementById('status-icon');
    const statusTitle = document.getElementById('status-title');
    const statusDetail= document.getElementById('status-detail');
    const cursor      = document.getElementById('virtual-cursor');
    const ripple      = document.getElementById('click-ripple');

    // ── State ──────────────────────────────────────────────────────────
    let vx = window.innerWidth  / 2;
    let vy = window.innerHeight / 2;
    let screenW = window.innerWidth;
    let screenH = window.innerHeight;
    let isConnected = false;
    let ws = null;
    let reconnectTimer = null;

    // ── Cursor helpers ─────────────────────────────────────────────────
    function moveCursor(x, y) {
      vx = Math.max(0, Math.min(screenW - 1, x));
      vy = Math.max(0, Math.min(screenH - 1, y));
      const displayX = (vx / screenW) * window.innerWidth;
      const displayY = (vy / screenH) * window.innerHeight;
      cursor.style.transform = `translate(${displayX}px, ${displayY}px)`;
    }

    function triggerPulse() {
      cursor.classList.remove('pulse');
      void cursor.offsetWidth; // force reflow
      cursor.classList.add('pulse');
    }

    function showCursor() {
      cursor.classList.add('visible');
    }

    function hideCursor() {
      cursor.classList.remove('visible');
    }

    function fireRipple(x, y) {
      const displayX = (x / screenW) * window.innerWidth;
      const displayY = (y / screenH) * window.innerHeight;
      ripple.style.left = displayX + 'px';
      ripple.style.top  = displayY + 'px';
      ripple.classList.remove('active');
      void ripple.offsetWidth; // force reflow
      ripple.classList.add('active');
    }

    // ── Tizen input injection ──────────────────────────────────────────
    // Samsung Tizen Smart TV SDKs expose tizen.inputdevice for key events,
    // and the webview supports synthesised pointer events.
    // We use elementFromPoint + PointerEvent dispatch for tap/drag.

    let pointerDownEl = null;
    let pointerDownX  = 0;
    let pointerDownY  = 0;

    function dispatchPointerAt(x, y, type, isPrimary) {
      const displayX = (x / screenW) * window.innerWidth;
      const displayY = (y / screenH) * window.innerHeight;
      const el = document.elementFromPoint(displayX, displayY) || document.body;
      const evt = new PointerEvent(type, {
        bubbles: true, cancelable: true,
        clientX: displayX, clientY: displayY,
        pointerId: 1, pointerType: 'mouse',
        isPrimary: true,
      });
      el.dispatchEvent(evt);
      return el;
    }

    function handleButtonDown(button) {
      if (button !== 'left' && button !== 0 && button !== undefined) return;
      cursor.classList.add('pressed');
      triggerPulse();
      pointerDownEl = dispatchPointerAt(vx, vy, 'pointerdown', true);
      pointerDownX  = vx;
      pointerDownY  = vy;
    }

    function handleButtonUp(button) {
      if (button !== 'left' && button !== 0 && button !== undefined) return;
      cursor.classList.remove('pressed');
      dispatchPointerAt(vx, vy, 'pointerup', true);

      const dx = Math.abs(vx - pointerDownX);
      const dy = Math.abs(vy - pointerDownY);
      if (dx < 8 && dy < 8) {
        // Tap — dispatch click
        const el = dispatchPointerAt(vx, vy, 'click', true);
        fireRipple(vx, vy);
        // Also try the element directly as some TV apps listen for 'click'
        const displayX = (vx / screenW) * window.innerWidth;
        const displayY = (vy / screenH) * window.innerHeight;
        const clickEvt = new MouseEvent('click', {
          bubbles: true, cancelable: true, clientX: displayX, clientY: displayY
        });
        el.dispatchEvent(clickEvt);
      }
      pointerDownEl = null;
    }

    // ── Status UI helpers ──────────────────────────────────────────────
    function setStatus(icon, iconClass, title, detail) {
      statusIcon.textContent = icon;
      statusIcon.className   = 'status-icon ' + iconClass;
      statusTitle.textContent  = title;
      statusDetail.textContent = detail;
    }

    function showOverlay() {
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    // ── WebSocket connection ───────────────────────────────────────────
    function connect() {
      const url = `ws://${WS_HOST}:${WS_PORT}${WS_TOKEN ? '?token=' + WS_TOKEN : ''}`;
      setStatus('📡', 'connecting', 'Connecting…', `ws://${WS_HOST}:${WS_PORT}`);
      showOverlay();

      try {
        ws = new WebSocket(url);
      } catch (e) {
        scheduleReconnect();
        return;
      }

      ws.addEventListener('open', () => {
        isConnected = true;
        setStatus('✅', 'connected', 'Connected', 'TVDev Studio cursor active');
        setTimeout(hideOverlay, 800);
        showCursor();
      });

      ws.addEventListener('message', (evt) => {
        let msg;
        try { msg = JSON.parse(evt.data); } catch { return; }
        handleMessage(msg);
      });

      ws.addEventListener('close', () => {
        isConnected = false;
        hideCursor();
        setStatus('🔌', 'error', 'Disconnected', 'TVDev Studio disconnected. Retrying…');
        showOverlay();
        scheduleReconnect();
      });

      ws.addEventListener('error', () => {
        // close event will fire next
      });
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect();
      }, RECONNECT_DELAY_MS);
    }

    // ── Message handler ────────────────────────────────────────────────
    function handleMessage(msg) {
      switch (msg.type) {
        case 'cursor_start':
          // Use server-reported screen dimensions for coordinate mapping
          screenW = msg.screen_w || window.innerWidth;
          screenH = msg.screen_h || window.innerHeight;
          vx = screenW / 2;
          vy = screenH / 2;
          moveCursor(vx, vy);
          showCursor();
          break;

        case 'move':
        case 'cursor_move':
          if (msg.x !== undefined && msg.y !== undefined) {
            moveCursor(msg.x, msg.y);
          } else {
            moveCursor(vx + (msg.dx || 0), vy + (msg.dy || 0));
          }
          break;

        case 'click':
        case 'cursor_down':
          handleButtonDown(msg.button);
          break;

        case 'cursor_up':
          handleButtonUp(msg.button);
          break;

        case 'cursor_scroll': {
          // Synthesise a WheelEvent at the current cursor position
          const el = document.elementFromPoint(vx, vy) || document.body;
          el.dispatchEvent(new WheelEvent('wheel', {
            bubbles: true, cancelable: true,
            clientX: vx, clientY: vy,
            deltaX: (msg.dx || 0) * 10,
            deltaY: (msg.dy || 0) * 10,
            deltaMode: WheelEvent.DOM_DELTA_PIXEL,
          }));
          break;
        }

        case 'cursor_end':
          hideCursor();
          setStatus('🔴', 'error', 'Cursor Released', 'Press ⌘⇧L on your Mac to re-enable.');
          showOverlay();
          break;
      }
    }

    // ── Init ───────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      screenW = window.innerWidth;
      screenH = window.innerHeight;
    });

    connect();
  </script>
</body>
</html>
